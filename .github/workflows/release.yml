name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"   # ignore any pre-release suffix (-rc/-beta) for the compare
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "Tag $TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo package

  github-release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..${GITHUB_REF_NAME}"
            echo "Generating notes for $RANGE"
          else
            RANGE="${GITHUB_REF_NAME}"
            echo "First release — including all commits"
          fi
          {
            echo "notes<<EOF"
            git log --pretty=format:'- %s (%h)' "$RANGE"
            echo
            echo
            echo "Published to [crates.io](https://crates.io/crates/skeleton-depth/${GITHUB_REF_NAME#v})."
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-crate:
    name: Publish to crates.io
    # crates.io publication is the only irreversible step of the pipeline
    # ("yank" removes nothing): it runs LAST, once the GitHub release — which is
    # revocable — actually exists. Reversed, a failed release would burn a
    # version number.
    needs: [verify, github-release]
    # No publish on pre-releases (v*-rc/-beta): a crates.io publish is final
    # (you can only "yank"). Gated at job level so a pre-release tag doesn't even
    # trigger an approval request.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write        # required to request the OIDC token from GitHub
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Trusted Publishing: no long-lived secret. GitHub attests the workflow
      # identity (repo + file + environment), crates.io verifies that attestation
      # against the registered config and issues an ephemeral token, revoked
      # automatically at the end of the job.
      - name: Get a temporary crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
